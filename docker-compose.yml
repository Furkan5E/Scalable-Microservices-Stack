version: '3.9'
services:
  # Flask application
  web:
    build: ./web # build from the Dockerfile in ./web/
    expose:
      - '5000' # expose to other containers only (not the host)
    environment:
      - APP_VERSION=2.0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine # use official image, no custom Dockerfile needed
    volumes:
      - redis_data:/data # persist Redis data across container restarts
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80' # only nginx is exposed to the host on port 8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # mount config file
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Named volumes
volumes:
  redis_data:
  postgres_data: