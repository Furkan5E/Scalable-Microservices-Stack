version: '3.9'
services:
  # Flask gateway: public API, owns the Redis hit counter
  web:
    build:
      context: .
      dockerfile: web/dockerfile
    expose:
      - '5000'
    environment:
      - APP_VERSION=2.0
      - HISTORY_SERVICE_URL=http://history:5000
    depends_on:
      redis:
        condition: service_healthy
      history:
        condition: service_healthy
    restart: unless-stopped

  # Flask history service: owns Postgres, records and serves visit history
  history:
    build:
      context: .
      dockerfile: history/dockerfile
    expose:
      - '5000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine 
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80' 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - web
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    env_file:
      - .env # Pulls secure passwords from your .env file
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes
volumes:
  redis_data:
  postgres_data: