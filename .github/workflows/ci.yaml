name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run test suite
        run: uv run python -m pytest web/tests history/tests

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images from this commit
        run: |
          docker build -f web/dockerfile -t ghcr.io/furkan5e/scalable-microservices-web:e2e .
          docker build -f history/dockerfile -t ghcr.io/furkan5e/scalable-microservices-history:e2e .

      - name: Create kind cluster
        run: kind create cluster --name e2e --wait 120s

      - name: Load images into the cluster
        run: |
          kind load docker-image ghcr.io/furkan5e/scalable-microservices-web:e2e --name e2e
          kind load docker-image ghcr.io/furkan5e/scalable-microservices-history:e2e --name e2e

      # Same manifests as a real deploy, but pointed at the images built above
      # instead of the :latest images published by the build jobs below.
      - name: Apply manifests
        run: |
          cp k8s/secrets.yaml.example k8s/secrets.yaml
          kubectl apply -f k8s/secrets.yaml
          for manifest in k8s/*.yaml; do
            sed -e 's|\(scalable-microservices-[a-z]*\):latest|\1:e2e|' \
                -e 's|imagePullPolicy: Always.*|imagePullPolicy: Never|' "$manifest" | kubectl apply -f -
          done

      - name: Run end-to-end checks
        run: bash scripts/e2e.sh

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods,hpa,networkpolicy -o wide
          kubectl describe pods
          kubectl logs deploy/web --tail=50
          kubectl logs deploy/history --tail=50

  # Images are only built and published once the unit tests and end-to-end checks pass.
  # Each one is tagged with the commit SHA as well as :latest, so any image can be traced
  # back to its commit and a rollback is a matter of pointing a manifest at an earlier SHA.
  build-web:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/furkan5e/scalable-microservices-web:latest
            ghcr.io/furkan5e/scalable-microservices-web:${{ github.sha }}

  build-history:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push History API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./history/dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/furkan5e/scalable-microservices-history:latest
            ghcr.io/furkan5e/scalable-microservices-history:${{ github.sha }}
