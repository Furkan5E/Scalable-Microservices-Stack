name: End to End

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images from this commit
        run: |
          docker build -f web/dockerfile -t ghcr.io/furkan5e/scalable-microservices-web:e2e .
          docker build -f history/dockerfile -t ghcr.io/furkan5e/scalable-microservices-history:e2e .

      - name: Create kind cluster
        run: kind create cluster --name e2e --wait 120s

      - name: Load images into the cluster
        run: |
          kind load docker-image ghcr.io/furkan5e/scalable-microservices-web:e2e --name e2e
          kind load docker-image ghcr.io/furkan5e/scalable-microservices-history:e2e --name e2e

      # Same manifests as a real deploy, but pointed at the images built above
      # instead of the :latest images published by the Build Docker workflow.
      - name: Apply manifests
        run: |
          cp k8s/secrets.yaml.example k8s/secrets.yaml
          kubectl apply -f k8s/secrets.yaml
          for manifest in k8s/*.yaml; do
            sed -e 's|\(scalable-microservices-[a-z]*\):latest|\1:e2e|' \
                -e 's|imagePullPolicy: Always.*|imagePullPolicy: Never|' "$manifest" | kubectl apply -f -
          done

      - name: Run end-to-end checks
        run: bash scripts/e2e.sh

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods,hpa,networkpolicy -o wide
          kubectl describe pods
          kubectl logs deploy/web --tail=50
          kubectl logs deploy/history --tail=50
