events {}

http {
    upstream flask_app {
    server web:5000; # 'web' resolves to the Flask container's IP
    }
    server {
        listen 80;
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health {
            proxy_pass http://flask_app/health;
        }
    }
}