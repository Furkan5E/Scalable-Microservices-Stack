events {}

http {
    # Shared by Docker Compose (mounted as a file) and Kubernetes (loaded into the nginx-config ConfigMap).
    # 'web' resolves to the Flask container on Compose and to the web Service on Kubernetes.
    upstream flask_app {
        server web:5000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health {
            proxy_pass http://flask_app/health;
        }
    }
}