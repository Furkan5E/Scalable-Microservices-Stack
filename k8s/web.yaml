apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # No replicas field: the HorizontalPodAutoscaler in web-hpa.yaml owns the replica count
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/furkan5e/scalable-microservices-web:latest
        imagePullPolicy: Always # :latest is rebuilt by CI on every push to master
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0"
        - name: HISTORY_SERVICE_URL
          value: "http://history:5000"
        securityContext:
          runAsNonRoot: true # the image runs as UID 10001; refuse to start if that ever changes
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi # 2 gunicorn workers peak ~100Mi under load; 128Mi was OOM-killed at shutdown
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
  - port: 5000