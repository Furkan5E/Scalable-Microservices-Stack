apiVersion: apps/v1
kind: Deployment
metadata:
  name: history
spec:
  selector:
    matchLabels:
      app: history
  template:
    metadata:
      labels:
        app: history
    spec:
      containers:
      - name: history
        image: ghcr.io/furkan5e/scalable-microservices-history:latest
        imagePullPolicy: Always # :latest is rebuilt by CI on every push to master
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: db-secrets
        securityContext:
          runAsNonRoot: true # the image runs as UID 10001; refuse to start if that ever changes
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: history
spec:
  selector:
    app: history
  ports:
  - port: 5000
